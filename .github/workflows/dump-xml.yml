name: Dump Godot 1.1 resources as XML

on:
  workflow_dispatch:
  push:
    branches: [claude/android-apk]
    paths: [.github/workflows/dump-xml.yml]

permissions:
  contents: write

jobs:
  dump:
    runs-on: ubuntu-latest
    env:
      GODOT_URL: https://github.com/godotengine/godot-builds/releases/download/1.1-stable
    steps:
      - uses: actions/checkout@v4
        with:
          path: project

      - name: Download Godot 1.1
        run: |
          curl -fsSL -o godot.zip "$GODOT_URL/Godot_v1.1_stable_x11.64.zip"
          unzip -q godot.zip -d godot
          chmod +x godot/Godot_v1.1_stable_x11.64

      - name: Convert binary resources to XML
        run: |
          cd project
          FILES=$(git ls-files '*.scn' '*.res' '*.fnt' '*.tex')
          echo "$FILES"
          mkdir -p xml_dump
          for f in $FILES; do mkdir -p "xml_dump/$(dirname "$f")"; done
          {
            echo 'extends SceneTree'
            echo 'func _init():'
            echo '	var files = ['
            for f in $FILES; do echo "		\"$f\","; done
            echo '	]'
            echo '	for f in files:'
            echo '		var res = ResourceLoader.load("res://" + f)'
            echo '		if res == null:'
            echo '			print("DUMP FAILED LOAD " + f)'
            echo '		else:'
            echo '			var err = ResourceSaver.save("res://xml_dump/" + f + ".xml", res)'
            echo '			print("DUMP " + f + " -> " + str(err))'
            echo '	quit()'
          } > dump_xml.gd
          cat dump_xml.gd
          cd ..
          docker run --rm -v "$PWD:/work" -w /work ubuntu:16.04 bash -c '
            apt-get update -qq &&
            apt-get install -y -qq xvfb xauth libssl1.0.0 libgl1-mesa-glx libgl1-mesa-dri libglu1-mesa \
              libxcursor1 libxinerama1 libxrandr2 libxi6 libasound2 libpulse0 libfreetype6 > /dev/null &&
            timeout 300 xvfb-run -a -s "-screen 0 1280x720x24" \
              /work/godot/Godot_v1.1_stable_x11.64 -path /work/project -script res://dump_xml.gd
            echo "godot exit code: $?"
          '
          sudo chown -R "$USER" project
          find project/xml_dump -type f | xargs ls -la

      - name: Push XML dump to branch
        run: |
          cd project
          rm dump_xml.gd
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b godot1-xml-dump
          git add xml_dump
          git commit -m "XML dump of Godot 1.1 binary resources [skip ci]"
          git push -f origin godot1-xml-dump
